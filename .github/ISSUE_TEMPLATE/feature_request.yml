name: Feature request
description: Suggest an improvement to the listening experience.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this improve?
      description: Describe the listening task or difficulty.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Include any offline, mobile, or accessibility needs.
    validations:
      required: true
