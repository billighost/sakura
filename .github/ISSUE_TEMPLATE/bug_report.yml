name: Bug report
description: Report a problem with Sakura.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the affected page and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "For example: iPhone, iOS 18, Safari; or Windows, Chrome"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Mention online/offline mode, playback status, or a screenshot if relevant. Omit credentials and private account data.
